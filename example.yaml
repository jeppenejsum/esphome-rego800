# ESPHome Rego800 Example Configuration
# This is a complete example for reading data from a Rego 800 heat pump controller

esphome:
  name: heatpump
  friendly_name: Heat Pump

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Heatpump Fallback"
    password: !secret ap_password

captive_portal:

# Include the Rego800 external component
external_components:
  - source: components
    components: [rego800]

# CAN bus configuration
# Adjust pins according to your hardware
canbus:
  - platform: esp32_can
    id: my_canbus
    tx_pin: GPIO27
    rx_pin: GPIO26
    can_id: 4
    use_extended_id: true
    bit_rate: 125KBPS

# Rego800 component configuration
rego800:
  canbus_id: my_canbus
  # Optional: ignore specific CAN IDs that generate too much noise
  ignore_ids: [0x9ffc030, 0x9ffc040]

# Temperature sensors
sensor:
  - platform: rego800
    rego_variable: T1
    name: "Supply Flow Temperature"

  - platform: rego800
    rego_variable: T2
    name: "Outdoor Temperature"

  - platform: rego800
    rego_variable: T3
    name: "Hot Water Temperature"

  - platform: rego800
    rego_variable: T6
    name: "Hot Gas Temperature"

  - platform: rego800
    rego_variable: T8
    name: "Heat Carrier Out"

  - platform: rego800
    rego_variable: T9
    name: "Heat Carrier In"

  - platform: rego800
    rego_variable: T10
    name: "Cold Carrier In"

  - platform: rego800
    rego_variable: T11
    name: "Cold Carrier Out"

  # Frequency sensors
  - platform: rego800
    rego_variable: COMPRESSOR
    name: "Compressor Frequency"

  - platform: rego800
    rego_variable: HEAT_FLUID_PUMP
    name: "Heat Fluid Pump"

  - platform: rego800
    rego_variable: COLD_FLUID_PUMP
    name: "Cold Fluid Pump"

# Binary sensors for pump/fan status
binary_sensor:
  - platform: rego800
    rego_variable: HEAT_FLUID_PUMP_CONTROL
    name: "Heat Fluid Pump Running"

  - platform: rego800
    rego_variable: COLD_FLUID_PUMP_CONTROL
    name: "Cold Fluid Pump Running"

  - platform: rego800
    rego_variable: COOLING_FAN
    name: "Cooling Fan Running"

# Text sensor for valve position
text_sensor:
  - platform: rego800
    rego_variable: THREEWAY_VALVE
    name: "3-Way Valve Position"
    # Override default options if needed:
    # options:
    #   0: "Heating"
    #   1: "Hot Water"
